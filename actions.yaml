list-versions:
  description: List Storage Versions supported by this charm
list-resources:
  description: List Storage Resources of configured version
  params:
    controller:
      type: string
      default: ""
      description: |
        Filter list based on "storage" manifests.
    resources:
      type: string
      default: ""
      description: |
        Space separated list of kubernetes resource types to filter list result
scrub-resources:
  description: Remove deployments other than the current one
  params:
    controller:
      type: string
      default: ""
      description: |
        Filter list based on "storage" manifests.
    resources:
      type: string
      default: ""
      description: |
        Space separated list of kubernetes resource types to filter scrubbing   
sync-resources:
  description: |
    Add kubernetes resources which should be created by this charm which aren't
    present within the cluster.
  params:
    controller:
      type: string
      default: ""
      description: |
        Filter list based on "storage" manifests.
    resources:
      type: string
      default: ""
      description: |
        Space separated list of kubernetes resource types
        to use a filter during the sync. This helps limit
        which missing resources are applied.
prepare-uninstall:
  description: Pause reconciliation across the application before uninstalling.
uninstall:
  description: Remove this installation's CSI resources without deleting volumes.
  params:
    legacy-uids:
      type: string
      default: ""
      description: Comma-separated UIDs of reviewed legacy resources to remove.
